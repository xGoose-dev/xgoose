name: Submit Chrome and Edge stores
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested GitHub release tag (vX.Y.Z)
        required: true
      store:
        description: Destination
        type: choice
        options: [both, chrome, edge]
        default: both
permissions:
  contents: read
concurrency:
  group: chromium-store-submission
  cancel-in-progress: false
jobs:
  submit:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        store: [chrome, edge]
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      SELECTED_STORE: ${{ inputs.store || 'both' }}
      TARGET_STORE: ${{ matrix.store }}
      GH_TOKEN: ${{ github.token }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.19.0'
      - id: credentials
        name: Check destination and credentials without exposing values
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {requiredSecrets} from './scripts/store-publish.mjs';
          const {RELEASE_TAG,SELECTED_STORE,TARGET_STORE,GITHUB_OUTPUT,GITHUB_STEP_SUMMARY}=process.env;
          if(!/^v\d+\.\d+\.\d+$/.test(RELEASE_TAG))throw Error('Invalid release tag');
          const selected=SELECTED_STORE==='both'||SELECTED_STORE===TARGET_STORE;
          const missing=requiredSecrets[TARGET_STORE].filter(key=>!process.env[key]);
          appendFileSync(GITHUB_OUTPUT,`ready=${selected&&!missing.length}\n`);
          if(selected&&missing.length)appendFileSync(GITHUB_STEP_SUMMARY,`## ${TARGET_STORE}: not submitted\nConfigure repository secrets: ${missing.join(', ')}. Use the browser dashboard until configured.\n`);
          JS
      - if: steps.credentials.outputs.ready == 'true'
        name: Download and verify immutable release artifacts
        run: |
          git fetch origin "refs/heads/main:refs/remotes/origin/main" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main
          gh release download "$RELEASE_TAG" --dir release-files
          cd release-files
          sha256sum --check SHA256SUMS
      - if: steps.credentials.outputs.ready == 'true'
        name: Upload and submit for store review
        run: |
          version="${RELEASE_TAG#v}"
          node scripts/store-publish.mjs "$TARGET_STORE" "release-files/xgoose-$TARGET_STORE-$version.zip" docs/store/reviewer-notes.txt > submission-result.json
          cat submission-result.json >> "$GITHUB_STEP_SUMMARY"
      - if: steps.credentials.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-result-${{ matrix.store }}-${{ github.run_id }}
          path: submission-result.json
          if-no-files-found: ignore

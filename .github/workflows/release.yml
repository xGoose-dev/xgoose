name: Chrome Release
on:
  push:
    branches: [main]
    paths:
      - package.json
      - apps/chrome/package.json
      - apps/chrome/static/manifest.json
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test and package without creating a tag or release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: chrome-release
  cancel-in-progress: false
jobs:
  prepare:
    name: Validate version and main ancestry
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 scripts/package-chrome.py --version-only)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo 'Releases must come from a commit already on main.' >&2
            exit 1
          }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo 'Tag and manifest versions differ.' >&2
              exit 1
            }
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Select main to run a manual release.' >&2
            exit 1
          elif [[ "$EVENT" == push ]]; then
            # Infrastructure changes alone must not publish a historical version.
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              echo 'release=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            previous=$(git show "${BEFORE}:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
            if [[ "$previous" == "$version" ]]; then
              echo 'release=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python3 -c 'import sys; a,b=[tuple(map(int,v.split("."))) for v in sys.argv[1:]]; assert b>a, "Release version must increase"' "$previous" "$version"
          fi
          echo 'release=true' >> "$GITHUB_OUTPUT"
  verify:
    name: Verify release
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    name: Publish tested GitHub Release
    needs: [prepare, verify]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-release-${{ github.sha }}
          path: release-files
      - name: Verify checksum
        working-directory: release-files
        run: sha256sum --check SHA256SUMS
      - id: release
        name: Release or dry run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [[ "$DRY_RUN" == true ]]; then
            echo "Dry run passed for $tag at $RELEASE_SHA. No tag or release created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch origin --tags
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            [[ "$(git rev-list -n 1 "$tag")" == "$RELEASE_SHA" ]] || {
              echo 'Existing version tag belongs to another commit; refusing replacement.' >&2
              exit 1
            }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$tag" --dir existing-release
            for file in release-files/*; do
              cmp "$file" "existing-release/$(basename "$file")"
            done
            echo "$tag has identical assets; nothing overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" release-files/* \
            --target "$RELEASE_SHA" --title "xgoose $VERSION" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Published [$tag](https://github.com/$GH_REPO/releases/tag/$tag)." >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch store submissions for the newly tested release
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh workflow run store-publish.yml --ref main -f tag="v$VERSION" -f store=both

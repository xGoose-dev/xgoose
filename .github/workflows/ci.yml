name: Chrome CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: chrome-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  regression:
    name: Tests, browser regression and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Release safety tests
        run: python3 -m unittest discover -s tests -p 'release_test.py'
      - run: node --test scripts/tests/*.test.mjs
      - run: npm run check
      - name: Safari adapter typecheck and packaged resources
        run: npm run typecheck -w xgoose-extension-safari && npm run build -w xgoose-extension-safari
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: npm run e2e
      - name: Safari viewport regression
        run: node tests/browser/safari-viewport.mjs
      - name: Reproducible release archive
        run: python3 scripts/package-chrome.py
      - run: python3 scripts/add-edge-artifact.py artifacts/ci-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-release-${{ github.sha }}
          path: artifacts/ci-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            artifacts/**/*.png
          if-no-files-found: ignore
          retention-days: 7

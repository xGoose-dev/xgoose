name: xgoose
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: 2L6B6ZA57F
    MARKETING_VERSION: '1.9'
    CURRENT_PROJECT_VERSION: '16'
    GENERATE_INFOPLIST_FILE: false
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  xgoose:
    type: application
    platform: iOS
    sources:
      - Native/App
      - Native/Shared
    info:
      path: Native/App/Info.plist
      properties:
        CFBundleDisplayName: xgoose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [xgoose]
            CFBundleURLName: org.xgoose.xgoose-safari
        ITSAppUsesNonExemptEncryption: false
        KeychainPrefix: 2L6B6ZA57F.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: Native/App/xgoose.entitlements
      properties:
        com.apple.security.application-groups: [group.org.xgoose.xgoose-safari]
        keychain-access-groups: [$(AppIdentifierPrefix)org.xgoose.xgoose-safari]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.xgoose.xgoose-safari
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: xgoose iOS App AppStore
    dependencies:
      - target: SafariExtension
  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - Native/Extension
      - Native/Shared
      - path: dist
        excludes: [images, skills]
        buildPhase: resources
      - path: dist/images
        type: folder
        buildPhase: resources
      - path: dist/skills
        type: folder
        buildPhase: resources
    info:
      path: Native/Extension/Info.plist
      properties:
        CFBundleDisplayName: xgoose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainPrefix: 2L6B6ZA57F.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Native/Extension/xgoose.entitlements
      properties:
        com.apple.security.application-groups: [group.org.xgoose.xgoose-safari]
        keychain-access-groups: [$(AppIdentifierPrefix)org.xgoose.xgoose-safari]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.xgoose.xgoose-safari.Extension
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: xgoose iOS Ext AppStore
  NativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.xgoose.xgoose-safari.Tests
      GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: xgoose
schemes:
  xgoose:
    build:
      targets:
        xgoose: all
    run:
      config: Debug
    test:
      targets: [NativeTests]
    archive:
      config: Release
